# Library issue forms: a print log, model details or the workshop setup
# submitted through an issue form becomes a pull request on
# library/print/issue-<N> that closes the issue when merged. Only people
# with write access trigger writes; anyone else's issue makes no job run past
# the trust checks, and the bot writes nothing (no label, no comment).
#
#   gather   job-level condition: the issue carries a form marker and its
#            author is OWNER, MEMBER or COLLABORATOR. With a read-only token
#            the pinned tool reads the issue and its body_html, untrusts it
#            when its body is no longer the triggering event's (a later edit
#            gets its own run), looks up the author's and the sender's
#            permission (write, maintain or admin required) and, only then,
#            downloads the photos. Parses nothing.
#   parse    runs the pinned tool with no token on that artifact: the form
#            becomes a ready change (files, tree, commit and its library
#            check) or a needs-info comment.
#   publish  holds the write token and runs only `publish --issue`, which
#            re-validates the artifact (the form's own paths only, size caps,
#            byte hashes, the same tree), pushes the bot branch, opens or
#            updates the pull request (or comments a compare link when Actions
#            may not open one), posts "Library check", or posts the one
#            needs-info comment and label.
#   closed   when the issue closes, closes its bot pull request and deletes
#            the bot-owned branch; when that pull request closes unmerged,
#            asks on the open issue for an edit.
#
# GitHub's event payload carries no association for the sender of an edit.
# Only the author, or someone with triage access or more, can edit an issue;
# gather's permission lookup then requires write access from that sender too.
# The sender judged is this event's, so gather trusts only the body this event
# carries: when a later edit has already changed it, nothing is written here.
name: Library issue forms

on:
  issues:
    types: [opened, edited, reopened, closed]
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  TOOL_SHA256: "9b26ee7aedf76d34c6e59e352d06d4f393fd14293e9325ee8584e100afde6ef0"

concurrency:
  group: library-issue-${{ github.event.issue.number || github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  gather:
    name: Gather the issue
    if: >-
      !github.event.repository.is_template &&
      github.event_name == 'issues' && github.event.action != 'closed' && github.event.issue.state == 'open' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
      (contains(github.event.issue.body, 'library-form:log-print') ||
      contains(github.event.issue.body, 'library-form:model-details') ||
      contains(github.event.issue.body, 'library-form:workshop'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      trusted: ${{ steps.gather.outputs.trusted }}
      form: ${{ steps.gather.outputs.form }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify the pinned tool
        run: echo "$TOOL_SHA256  .library/tool.mjs" | sha256sum --check --strict
      - name: Read the issue, permissions and photos
        id: gather
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          node .library/tool.mjs gather --repository="$REPOSITORY" --issue="$ISSUE" --sender="$SENDER" --event="$GITHUB_EVENT_PATH" --out="$RUNNER_TEMP/gathered" | tee "$RUNNER_TEMP/gather-result.json"
          jq -r '"trusted=\(.trusted == true)", "form=\(.form // "")"' "$RUNNER_TEMP/gather-result.json" >> "$GITHUB_OUTPUT"
      - if: steps.gather.outputs.trusted == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-gathered
          path: ${{ runner.temp }}/gathered
          retention-days: 1

  parse:
    name: Read the form
    needs: gather
    if: needs.gather.outputs.trusted == 'true' && needs.gather.outputs.form != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Every branch is fetched: models drafted on open bot branches are known to the writers.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify the pinned tool
        run: echo "$TOOL_SHA256  .library/tool.mjs" | sha256sum --check --strict
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: issue-gathered
          path: ${{ runner.temp }}/gathered
      - name: Read the form and check the change
        env:
          FORM: ${{ needs.gather.outputs.form }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VISIBILITY: ${{ github.event.repository.private && 'private' || 'public' }}
        run: |
          set -uo pipefail
          args=(--from-issue "$RUNNER_TEMP/gathered" --mode actions --repo-dir . --repository="$REPOSITORY" --default-branch="$DEFAULT_BRANCH" --visibility="$VISIBILITY" --out "$RUNNER_TEMP/form")
          status=0
          case "$FORM" in
            log-print) node .library/tool.mjs log-print "${args[@]}" || status=$? ;;
            model-details) node .library/tool.mjs details "${args[@]}" || status=$? ;;
            workshop) node .library/tool.mjs workshop set "${args[@]}" || status=$? ;;
            *) echo "Unknown form" >&2; exit 2 ;;
          esac
          # 0: ready, 1: needs-info; both are in the artifact. Anything else failed.
          test "$status" -le 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-form
          path: ${{ runner.temp }}/form
          retention-days: 1

  publish:
    name: Publish the form
    needs: [gather, parse]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify the pinned tool
        run: echo "$TOOL_SHA256  .library/tool.mjs" | sha256sum --check --strict
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: issue-form
          path: ${{ runner.temp }}/form
      - name: Push the change and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          FORM: ${{ needs.gather.outputs.form }}
          ISSUE: ${{ github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The token reaches git through environment configuration for this step only, never stored.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          node .library/tool.mjs publish --issue "$RUNNER_TEMP/form" --mode actions \
            --repository="$REPOSITORY" --default-branch="$DEFAULT_BRANCH" --issue-number="$ISSUE" --form="$FORM"

  closed:
    name: Follow up a closed issue or pull request
    if: >-
      !github.event.repository.is_template &&
      ((github.event_name == 'issues' && github.event.action == 'closed' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
      (contains(github.event.issue.body, 'library-form:log-print') ||
      contains(github.event.issue.body, 'library-form:model-details') ||
      contains(github.event.issue.body, 'library-form:workshop'))) ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && !github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'library/print/issue-')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify the pinned tool
        run: echo "$TOOL_SHA256  .library/tool.mjs" | sha256sum --check --strict
      - name: Close the bot pull request, or ask on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE: ${{ github.event.issue.number }}
          PULL: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          if [ "$EVENT_NAME" = issues ]; then
            node .library/tool.mjs publish --closed-issue="$ISSUE" --mode actions --repository="$REPOSITORY" --default-branch="$DEFAULT_BRANCH"
          else
            node .library/tool.mjs publish --closed-pull="$PULL" --mode actions --repository="$REPOSITORY" --default-branch="$DEFAULT_BRANCH"
          fi
